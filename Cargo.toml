[workspace]
resolver = "2"
members = [
    "argus-dispatcher-core",
    "argus-hyperliquid",
    "argus-lighter",
]

[workspace.dependencies]
flate2 = "1.0"
base64 = "0.22"
serde_json = "1.0"
crossbeam = "0.8.4"
event-listener = "5.4.1"
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
argus-dispatcher-core = { path = "argus-dispatcher-core", version = "0.1.0" }
